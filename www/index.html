<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Strike Force Heroes Trilogy</title>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        #menu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #fff; }
        .btn { background: #ff4500; color: white; padding: 15px 30px; margin: 10px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        
        #game-container { width: 100vw; height: 100vh; display: none; position: absolute; top: 0; left: 0; background: #000; overflow: hidden; }
        #player { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #player > ruffle-player { width: 100vw !important; height: 100vh !important; display: block !important; }

        /* Touch Overlay Layer - Hidden by default during loading/menus */
        .touch-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; display: none; }
        
        /* Left Movement Joystick */
        .joystick-area { position: absolute; width: 150px; height: 150px; border-radius: 50%; pointer-events: auto; bottom: 30px; left: 30px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.25); }
        .joystick-stick { position: absolute; top: 37.5px; left: 37.5px; width: 75px; height: 75px; border-radius: 50%; background: rgba(255, 255, 255, 0.4); }

        /* Right Trackpad Aim Zone (Covers right half of screen) */
        #aim-trackpad { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; background: rgba(255, 69, 0, 0.03); }

        /* Action Utility Buttons */
        .action-btn { position: absolute; background: rgba(0, 0, 0, 0.6); color: white; border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; pointer-events: auto; font-size: 16px; width: 55px; height: 55px; }
        #btn-reload { bottom: 180px; right: 30px; }
        #btn-switch { bottom: 180px; right: 95px; }
        #btn-killstreak { bottom: 180px; right: 160px; }

        /* Floating Control Toggle Button */
        #toggle-controls-btn { position: absolute; top: 15px; right: 15px; z-index: 10000; background: rgba(255, 69, 0, 0.9); color: white; border: 2px solid rgba(255, 255, 255, 0.5); padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    </style>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            pageUrl: "https://games.armorgames.com/",
            autoplay: "on",
            letterbox: "on",
            quality: "low", // Maximizes FPS and eliminates mobile lag
            preferredRenderer: "webgl",
            compatibilityRules: true,
            allowNetworking: "all",
            allowScriptAccess: true,
            urlRewriteRules: [
                ["https://games.armorgames.com/games/", "SWF/"]
            ]
        };
    </script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="menu">
        <h1>Strike Force Heroes Trilogy</h1>
        <button class="btn" onclick="launchGame('strike-force-heroes-1.swf')">Play SFH 1</button>
        <button class="btn" onclick="launchGame('strike-force-heroes-2.swf')">Play SFH 2</button>
        <button class="btn" onclick="launchGame('strike-force-heroes-3.swf')">Play SFH 3</button>
    </div>

    <div id="game-container">
        <button id="toggle-controls-btn" onclick="toggleControls()">Controls: OFF</button>
        <div id="player"></div>
        <div class="touch-overlay" id="controls">
            <div class="joystick-area" id="move-joystick">
                <div class="joystick-stick" id="move-stick"></div>
            </div>
            <div id="aim-trackpad"></div>
            <div class="action-btn" id="btn-reload">R</div>
            <div class="action-btn" id="btn-switch">Q</div>
            <div class="action-btn" id="btn-killstreak">E</div>
        </div>
    </div>

    <script src="js/touch-controls.js"></script>
    <script>
        let controlsVisible = false;

        function toggleControls() {
            controlsVisible = !controlsVisible;
            const controlsEl = document.getElementById('controls');
            const btnEl = document.getElementById('toggle-controls-btn');
            if (controlsVisible) {
                controlsEl.style.display = 'block';
                btnEl.textContent = 'Controls: ON';
                btnEl.style.background = 'rgba(0, 140, 0, 0.9)';
            } else {
                controlsEl.style.display = 'none';
                btnEl.textContent = 'Controls: OFF';
                btnEl.style.background = 'rgba(255, 69, 0, 0.9)';
            }
        }

                async function launchGame(swfFile) {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            
            try {
                const res = await fetch('SWF/' + swfFile);
                if (!res.ok) throw new Error("Failed to fetch local file");
                const swfData = await res.arrayBuffer();

                setTimeout(() => {
                    const ruffle = window.RufflePlayer.newest();
                    const player = ruffle.createPlayer();
                    const container = document.getElementById('player');
                    container.innerHTML = '';
                    container.appendChild(player);
                    
                    player.load({
                        data: swfData,
                        swfUrl: 'https://games.armorgames.com/games/' + swfFile,
                        pageUrl: 'https://games.armorgames.com/',
                        base: 'https://games.armorgames.com/'
                    });

                    initTouchControls(player);
                }, 100);
            } catch (e) {
                alert("Error launching game: " + e.message);
                document.getElementById('menu').style.display = 'flex';
                document.getElementById('game-container').style.display = 'none';
            }
        }</script>
</body>
</html>
