<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Strike Force Heroes Trilogy</title>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        #menu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #fff; }
        .btn { background: #ff4500; color: white; padding: 15px 30px; margin: 10px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        
        #game-container { width: 100vw; height: 100vh; display: none; position: absolute; top: 0; left: 0; background: #000; overflow: hidden; }
        #player { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #player > ruffle-player { width: 100vw !important; height: 100vh !important; display: block !important; }

        /* Touch Overlay Layer */
        .touch-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; }
        
        /* Joysticks */
        .joystick-area { position: absolute; width: 150px; height: 150px; border-radius: 50%; pointer-events: auto; }
        #move-joystick { bottom: 30px; left: 30px; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3); }
        #aim-joystick { bottom: 30px; right: 30px; background: rgba(255, 69, 0, 0.25); border: 2px solid rgba(255, 69, 0, 0.5); }
        
        .joystick-stick { position: absolute; top: 37.5px; left: 37.5px; width: 75px; height: 75px; border-radius: 50%; }
        #move-stick { background: rgba(255, 255, 255, 0.5); }
        #aim-stick { background: rgba(255, 69, 0, 0.7); }

        /* Action Utility Buttons */
        .action-btn { position: absolute; background: rgba(0, 0, 0, 0.6); color: white; border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; pointer-events: auto; font-size: 16px; width: 55px; height: 55px; }
        #btn-reload { bottom: 200px; right: 30px; }
        #btn-switch { bottom: 200px; right: 100px; }
        #btn-killstreak { bottom: 200px; right: 170px; }

        /* Fullscreen Interactive Tap Zone for Menus */
        #menu-tap-zone { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: auto; z-index: 9990; display: none; }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="menu">
        <h1>Strike Force Heroes Trilogy</h1>
        <button class="btn" onclick="launchGame('strike-force-heroes-1.swf')">Play SFH 1</button>
        <button class="btn" onclick="launchGame('strike-force-heroes-2.swf')">Play SFH 2</button>
        <button class="btn" onclick="launchGame('strike-force-heroes-3.swf')">Play SFH 3</button>
    </div>

    <div id="game-container">
        <div id="player"></div>
        <div id="menu-tap-zone"></div>
        <div class="touch-overlay" id="controls">
            <div class="joystick-area" id="move-joystick">
                <div class="joystick-stick" id="move-stick"></div>
            </div>
            <div class="joystick-area" id="aim-joystick">
                <div class="joystick-stick" id="aim-stick"></div>
            </div>
            <div class="action-btn" id="btn-reload">R</div>
            <div class="action-btn" id="btn-switch">Q</div>
            <div class="action-btn" id="btn-killstreak">E</div>
        </div>
    </div>

    <script src="js/touch-controls.js"></script>
    <script>
        function launchGame(swfFile) {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            
            window.RufflePlayer = window.RufflePlayer || {};
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById('player');
            container.appendChild(player);
            
            player.load({
                url: 'SWF/' + swfFile,
                allowScriptAccess: true,
                autoplay: 'on',
                scale: 'exactFit',
                preferredRenderer: 'webgl'
            });

            initTouchControls(player);
        }
    </script>
</body>
</html>
